version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password_123
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-api/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  # Redis Cache
  redis:
    image: redis:7
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  # Backend API (Node.js)
  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ecommerce_user
      DB_PASSWORD: ecommerce_password_123
      DB_NAME: ecommerce_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_PORT: 5000
      NODE_ENV: development
      JWT_SECRET: local_secret_key_for_testing_only
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-dummy_key}
      RAZORPAY_SECRET_KEY: ${RAZORPAY_SECRET_KEY:-dummy_secret}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-dummy_account}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-dummy_key}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_network
    volumes:
      - ./backend-api:/app
    restart: unless-stopped

  # Customer Website (React)
  customer:
    build:
      context: ./amazon-customer-website
      dockerfile: Dockerfile
    container_name: ecommerce_customer
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_NAME: ShopHub
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ecommerce_network
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Admin Dashboard (React)
  admin:
    build:
      context: ./admin-seller-dashboard
      dockerfile: Dockerfile
    container_name: ecommerce_admin
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_NAME: ShopHub Admin
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - ecommerce_network
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ecommerce_network:
    driver: bridge
